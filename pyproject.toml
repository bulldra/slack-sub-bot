[project]
name = "main"
version = "0.1.0"
description = ""
authors = [{ name = "bulldra", email = "bulldra@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "functions-framework>=3.10.0",
    "google-cloud-logging>=3.16.0",
    "requests>=2.34.0",
    "slack-sdk>=3.44.0",
    "types-requests>=2.33.0",
    "types-beautifulsoup4>=4.12.0",
    "pytest>=9.0.0",
    "feedparser>=6.0.14",
    "pypdf>=6.0.0",
    "pydub>=0.25.1",
    "pydantic>=2.13.0",
    "google-api-python-client>=2.200.0",
    "google-cloud-storage>=3.14.0",
    "google-genai>=2.24.0",
    "tweepy>=4.17.0",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "black==24.4.2",
]

[tool.black]
line-length = 88
target-version = ["py312"]
